<div class="row g-4">
  @for (cake of cakes; track cake._id) {
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card h-100">
        <div class="card-body d-flex flex-column text-center">
          <div class="mb-2">
            <svg width="88" height="88" viewBox="0 0 200 200" fill="none" aria-hidden="true">
              <ellipse cx="100" cy="172" rx="70" ry="10" fill="var(--pink-blush)"/>
              <rect x="42" y="120" width="116" height="42" rx="6" fill="var(--brown-soft)"/>
              <rect x="42" y="120" width="116" height="10" fill="var(--pink-blush-2)"/>
              <rect x="52" y="76" width="96" height="46" rx="6" fill="var(--pink)"/>
              <rect x="52" y="76" width="96" height="10" fill="var(--pink-blush)"/>
              <rect x="64" y="38" width="72" height="40" rx="6" fill="var(--brown-mid)"/>
              <rect x="64" y="38" width="72" height="9" fill="var(--pink-blush-2)"/>
              <path d="M64 76c6-6 12 6 18 0s12 6 18 0 12 6 18 0 12 6 18 0" stroke="var(--pink-blush)" stroke-width="3" fill="none" stroke-linecap="round"/>
              <path d="M52 122c5-6 11 6 16 0s11 6 16 0 11 6 16 0 11 6 16 0 11 6 16 0 11 6 16 0" stroke="var(--pink-blush)" stroke-width="3" fill="none" stroke-linecap="round"/>
              <circle cx="100" cy="31" r="7" fill="var(--cherry, #C24B67)"/>
              <path d="M100 24c0-8 6-12 10-13" stroke="var(--brown-mid)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="h5 card-title">{{ cake.name }}</h3>
          <p class="card-text small text-body-secondary">{{ cake.desc }}</p>
          <div class="mb-3">
            @for (tag of cake.tags ?? []; track tag) {
              <span class="badge rounded-pill price-badge me-1">{{ tag }}</span>
            }
          </div>
          <div class="d-flex justify-content-between align-items-center mt-auto">
            <span class="badge rounded-pill price-badge fs-6 fw-semibold">{{ cake.price | price }}</span>
            <form method="post" action="/orders">
              <input type="hidden" name="cakeId" value="{{ cake._id }}">
              <button class="btn btn-add rounded-circle" type="submit" title="Order {{ cake.name }}">+</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  }
</div>
